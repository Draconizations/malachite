name: Dist
on:
  workflow_run:
    workflows: [Tests]
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    name: Build & Commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build dist
        run: pnpm build |
             pnpm build --full
             pnpm types
      - name: Commit build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.io'
          git add ./dist
          git diff --staged --quiet || git commit -m "[bot] update dist" && git push